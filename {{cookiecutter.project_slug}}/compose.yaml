# Local lakehouse for development and tests (all open source):
#   Kafka -> Flink (+ SQL Gateway) -> Iceberg REST catalog + S3-compatible storage (RustFS)
# In other environments only the endpoints in .env change; nothing else is wired to Docker.
x-s3-credentials: &s3-credentials
  AWS_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY:-lakeadmin}
  AWS_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_KEY:-lakeadmin-secret}
  AWS_REGION: us-east-1

x-flink: &flink
  image: {{ cookiecutter.project_slug }}-flink:1.20
  environment: &flink-env
    <<: *s3-credentials
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: flink-jobmanager
      rest.address: flink-jobmanager
      taskmanager.numberOfTaskSlots: 4
      state.checkpoints.dir: file:///tmp/flink-checkpoints

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT for clients on the host (localhost:9092), INTERNAL for containers (kafka:19092).
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  storage:
    image: rustfs/rustfs:1.0.3
    ports:
      - "9000:9000"
    environment:
      RUSTFS_ACCESS_KEY: ${LOCAL_S3_ACCESS_KEY:-lakeadmin}
      RUSTFS_SECRET_KEY: ${LOCAL_S3_SECRET_KEY:-lakeadmin-secret}
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9000' || nc -z localhost 9000"]
      interval: 5s
      timeout: 5s
      retries: 20

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.0
    ports:
      - "8181:8181"
    environment:
      <<: *s3-credentials
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://storage:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on:
      storage:
        condition: service_healthy

  flink-jobmanager:
    <<: *flink
    build: ./ingestion/flink
    command: jobmanager
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8081'"]
      interval: 5s
      timeout: 5s
      retries: 30

  flink-taskmanager:
    <<: *flink
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy

  flink-sql-gateway:
    <<: *flink
    command: >-
      /opt/flink/bin/sql-gateway.sh start-foreground
      -Dsql-gateway.endpoint.rest.address=0.0.0.0
      -Dsql-gateway.endpoint.rest.port=8083
    ports:
      - "8083:8083"
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8083'"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  storage-data:
