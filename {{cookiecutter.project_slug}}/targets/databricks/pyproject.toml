[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medallion"
version = "0.1.0"
description = "{{ cookiecutter.project_name }}: Kafka -> Delta bronze/silver/gold"
requires-python = ">=3.10"
# pyspark and delta-spark are provided by the Databricks runtime.
dependencies = ["pyyaml>=6"]

[project.scripts]
medallion = "medallion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
