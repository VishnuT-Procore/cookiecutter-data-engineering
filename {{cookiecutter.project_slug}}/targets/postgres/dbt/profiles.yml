{{ cookiecutter.project_slug }}:
  target: "{% raw %}{{ env_var('DBT_TARGET', 'dev') }}{% endraw %}"
  outputs:
    dev: &postgres
      type: postgres
      host: "{% raw %}{{ env_var('POSTGRES_HOST', 'localhost') }}{% endraw %}"
      port: "{% raw %}{{ env_var('POSTGRES_PORT', '5432') | as_number }}{% endraw %}"
      user: "{% raw %}{{ env_var('POSTGRES_USER', 'dbt') }}{% endraw %}"
      password: "{% raw %}{{ env_var('POSTGRES_PASSWORD', 'dbt') }}{% endraw %}"
      dbname: "{% raw %}{{ env_var('POSTGRES_DB', 'warehouse') }}{% endraw %}"
      schema: "{% raw %}{{ env_var('POSTGRES_SCHEMA', 'dev') }}{% endraw %}"
      threads: 4
    prod:
      <<: *postgres
      schema: analytics
