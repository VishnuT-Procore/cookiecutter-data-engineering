name: {{ cookiecutter.project_slug }}
version: "1.0.0"
config-version: 2
profile: {{ cookiecutter.project_slug }}

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Incremental runs re-read this many minutes before the current watermark to catch late commits.
  lookback_minutes: 60

models:
  {{ cookiecutter.project_slug }}:
    bronze:
      +schema: bronze
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
    silver:
      +schema: silver
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
    gold:
      +schema: gold
      +materialized: table
