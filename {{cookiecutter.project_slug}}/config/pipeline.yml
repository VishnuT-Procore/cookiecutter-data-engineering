# Single source of truth for the pipeline. After editing run `make generate`
# (CI runs `make check-generated`).
#
#   Kafka --(Flink, append-only)--> Iceberg landing --(dbt on the target)--> bronze --> silver --> gold
#
# Column types: string, integer, bigint, double, boolean, date, timestamp (ISO-8601 string),
#               timestamp_ms / timestamp_us (epoch millis / micros), decimal(p,s)

project: {{ cookiecutter.project_slug }}
target: {{ cookiecutter.target }}

# debezium: value is a Debezium envelope {before, after, op, ts_ms}; ordering by ts_ms then offset.
# json:     value is the full row; a tombstone (null value) deletes the key; ordering by Kafka offset.
payload_format: {{ cookiecutter.payload_format }}

# Iceberg namespace of the landing tables (one table per entity, raw Kafka records).
landing_namespace: {{ cookiecutter.landing_namespace }}

entities:
  - name: customers
    topic: {{ cookiecutter.topic_prefix }}.customers
    description: Customer master data.
    primary_key: [id]
    columns:
      - {name: id, type: bigint, description: Customer id.}
      - {name: name, type: string}
      - {name: email, type: string}
      - {name: street, type: string}
      - {name: city, type: string}
      - {name: country, type: string}
      - {name: updated_at, type: timestamp, description: Last change in the source system.}

  - name: orders
    topic: {{ cookiecutter.topic_prefix }}.orders
    description: Customer orders.
    primary_key: [order_id]
    columns:
      - {name: order_id, type: bigint}
      - {name: customer_id, type: bigint}
      - {name: status, type: string}
      - {name: amount, type: "decimal(18,2)"}
      - {name: updated_at, type: timestamp}
