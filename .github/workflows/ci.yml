name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v tests

  # Generate projects and run each project's own test suite:
  # duckdb = full end-to-end on the local lakehouse; databricks/snowflake = offline checks.
  generated-project:
    needs: bake
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [duckdb, databricks, snowflake]
        payload_format: [debezium]
        orchestrator: [dagster]
        include:
          - {target: duckdb, payload_format: json, orchestrator: none}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate project
        run: |
          python -m pip install cookiecutter
          cookiecutter . --no-input -o "$RUNNER_TEMP/out" \
            target=${{ matrix.target }} payload_format=${{ matrix.payload_format }} orchestrator=${{ matrix.orchestrator }}
      - name: Test generated project
        working-directory: ${{ runner.temp }}/out/orders_medallion
        run: |
          make install
          make check-generated
          make test
